<section class="contact">
    <header>
        <h1>Contacto</h1>
        <p>Si tenés alguna pregunta, sugerencia o comentario, no dudes en ponerte en contacto con nosotros. Estaremos encantados de ayudarte.</p>
    </header>
    <form>
        <!--la etiqueta label se utiliza para asociar un texto descriptivo con un elemento de formulario, como un campo de entrada o un área de texto. El atributo for del label debe coincidir con el atributo id del elemento de formulario correspondiente. Esto mejora la accesibilidad y la usabilidad del formulario, ya que permite a los usuarios hacer clic en el texto del label para enfocar el campo de entrada asociado.-->
        <fieldset>
            <legend>Formulario de contacto</legend>
            <div>
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" placeholder="Ingresá tu nombre" autocomplete="name" required>
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu email" autocomplete="email" required>
            </div>

            <div>
            <label for="subject">Asunto:</label>
            <select id="subject" name="subject" required>
                <option value="">Selecciona una opción</option>
                <option value="purchase">Problema con una compra</option>
                <option value="payment">Problema con un pago</option>
                <option value="key">Problema con una clave</option>
                <option value="refund">Devolución / Reembolso</option>
                <option value="account">Problema con mi cuenta</option>
                <option value="other">Otro</option>
            </select>
            </div>

            <div>
            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" placeholder="Escribí tu consulta" required></textarea>
            </div>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
        <a href="index.html" class="index-button">Ir al inicio</a>
</section>
